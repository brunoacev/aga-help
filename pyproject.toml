[project]
name = "aga-help"
version = "1.0.0"
description = "Sistema Kanban AGA HELP / Agatek"
requires-python = ">=3.10"
dependencies = [
    "flet==0.86.5",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
